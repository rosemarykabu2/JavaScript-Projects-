<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1 id="title">Welcome to VEYA</h1>

  <p class="message">Your attendance matters.</p>

  <button>Submit Attendance</button>

  <h1 id="heading">Welcome</h1>

  <p class="content">Please sign in.</p>

  <script>
    let heading = document.querySelector('#title');

    let message = document.querySelector('.message');

    let button = document.querySelector('button');

    heading.textContent = 'Your Attendance';

    message.innerHTML = '<strong>Attendance successful!</strong>';

    let title = document.querySelector('#heading');
    let paragraph = document.querySelector('.content')

    title.textContent = 'Welcome to VEYA'
    paragraph.innerHTML = '<b>Attendance is open</b>'
  </script>
</body>
</html>
